name: Daily Stock Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "7 23 * * 0-4"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock scanner
        run: python scanner.py

      - name: Save latest results
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "stock-radar-bot@users.noreply.github.com"
          git add data/latest.json data/latest.csv
          git diff --cached --quiet || git commit -m "Auto update stock scan"
          git push
